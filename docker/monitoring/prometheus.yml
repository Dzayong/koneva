global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: api-gateway
    dns_sd_configs:
      - names: ["api-gateway"]
        type: A
        port: 8000
        refresh_interval: 30s
    metrics_path: /metrics
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
