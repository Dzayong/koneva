openapi: 3.0.3
info:
  title: WA Gateway Tenant API
  version: 1.1.0
  description: Tenant-scoped API. Public fields use snake_case and timestamps are ISO 8601.
servers:
  - url: http://localhost:8000
security:
  - tenantApiKey: []
paths:
  /health:
    get: { security: [], summary: Liveness check, responses: { "200": { description: Healthy } } }
  /api/v1/tenant:
    get: { summary: Get tenant, responses: { "200": { $ref: '#/components/responses/Success' } } }
    patch:
      summary: Update webhook URL
      requestBody: { $ref: '#/components/requestBodies/TenantUpdate' }
      responses: { "200": { $ref: '#/components/responses/Success' }, "400": { $ref: '#/components/responses/Error' } }
  /api/v1/devices:
    get: { summary: List devices, responses: { "200": { $ref: '#/components/responses/Success' } } }
    post:
      summary: Create device
      requestBody: { $ref: '#/components/requestBodies/DeviceCreate' }
      responses: { "201": { $ref: '#/components/responses/Success' }, "429": { $ref: '#/components/responses/Error' } }
  /api/v1/devices/{key}:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' } ]
    get: { summary: Get device, responses: { "200": { $ref: '#/components/responses/Success' }, "404": { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete device, responses: { "200": { $ref: '#/components/responses/Success' }, "404": { $ref: '#/components/responses/Error' } } }
  /api/v1/devices/{key}/qr:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' } ]
    get: { summary: Get status and nullable QR, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/devices/{key}/pause:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' } ]
    post: { summary: Pause device, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/devices/{key}/resume:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' } ]
    post: { summary: Resume device, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/devices/{key}/stats:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' } ]
    get: { summary: Per-device message stats, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/devices/{key}/whatsapp-groups:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' } ]
    get: { summary: List WhatsApp groups and communities, responses: { "200": { $ref: '#/components/responses/Success' } } }
    post:
      summary: Create a WhatsApp group
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, participants], properties: { name: { type: string }, participants: { type: array, minItems: 1, maxItems: 50, items: { type: string } } } } } }
      responses: { "201": { $ref: '#/components/responses/Success' }, "403": { $ref: '#/components/responses/Error' } }
  /api/v1/devices/{key}/whatsapp-groups/{jid}:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' }, { name: jid, in: path, required: true, schema: { type: string, example: '120363000000-123456@g.us' } } ]
    patch: { summary: Update group name or description, requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string } } } } } }, responses: { "200": { $ref: '#/components/responses/Success' } } }
    delete: { summary: Leave the group from this linked number (does not delete it for other members), responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/devices/{key}/whatsapp-groups/{jid}/members:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' }, { name: jid, in: path, required: true, schema: { type: string } } ]
    post: { summary: Add, remove, promote, or demote group members, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [action, participants], properties: { action: { type: string, enum: [add, remove, promote, demote] }, participants: { type: array, minItems: 1, maxItems: 50, items: { type: string } } } } } } }, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/devices/{key}/whatsapp-communities:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' } ]
    post: { summary: Create a community, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, description: { type: string } } } } } }, responses: { "201": { $ref: '#/components/responses/Success' } } }
  /api/v1/devices/{key}/whatsapp-communities/{jid}:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' }, { name: jid, in: path, required: true, schema: { type: string } } ]
    patch: { summary: Update community name or description, requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string } } } } } }, responses: { "200": { $ref: '#/components/responses/Success' } } }
    delete: { summary: Leave the community from this linked number, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/devices/{key}/whatsapp-communities/{jid}/groups:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' }, { name: jid, in: path, required: true, schema: { type: string } } ]
    post: { summary: Link or unlink a group in a community, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [group_jid, action], properties: { group_jid: { type: string }, action: { type: string, enum: [link, unlink] } } } } } }, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/devices/{key}/whatsapp-channel:
    parameters: [ { $ref: '#/components/parameters/DeviceKey' } ]
    get: { summary: Look up public channel metadata from an invite URL, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/messages:
    get:
      summary: List and filter messages
      parameters:
        - { name: device_key, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MessageStatus' } }
        - { name: direction, in: query, schema: { type: string, enum: [inbound, outbound] } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses: { "200": { $ref: '#/components/responses/Paginated' } }
  /api/v1/messages/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Message detail and status history, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/messages/{id}/retry:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post: { summary: Retry failed or blocked message (recipient consent is checked again), responses: { "202": { $ref: '#/components/responses/Success' }, "409": { $ref: '#/components/responses/Error' } } }
  /api/v1/message/send:
    post:
      summary: Queue one message; promotional sends require opt-in (409 if missing or opted out)
      requestBody: { $ref: '#/components/requestBodies/SendMessage' }
      responses: { "202": { $ref: '#/components/responses/Success' } }
  /api/v1/broadcast:
    post:
      summary: Queue for up to 500 recipients; consent refusals are returned per recipient
      requestBody: { $ref: '#/components/requestBodies/Broadcast' }
      responses: { "202": { $ref: '#/components/responses/Success' } }
  /api/v1/contacts:
    get:
      summary: List contacts
      parameters: [ { name: search, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' } ]
      responses: { "200": { $ref: '#/components/responses/Paginated' } }
    post: { summary: Create contact, requestBody: { $ref: '#/components/requestBodies/Contact' }, responses: { "201": { $ref: '#/components/responses/Success' } } }
  /api/v1/contacts/import:
    post:
      summary: Import CSV contacts
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [csv], properties: { csv: { type: string } } } } } }
      responses: { "201": { $ref: '#/components/responses/Success' } }
  /api/v1/contacts/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Get contact, responses: { "200": { $ref: '#/components/responses/Success' } } }
    patch: { summary: Update contact, requestBody: { $ref: '#/components/requestBodies/Contact' }, responses: { "200": { $ref: '#/components/responses/Success' } } }
    delete: { summary: Delete contact, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/contacts/{id}/consent:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Read current recipient consent and audit history, responses: { "200": { $ref: '#/components/responses/Success' }, "404": { $ref: '#/components/responses/Error' } } }
    put:
      summary: Record manual consent; requires a signed-in workspace user and source note (API keys are refused)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, source_note]
              properties:
                status: { type: string, enum: [opted_in, opted_out] }
                source_note: { type: string, minLength: 1, maxLength: 500 }
      responses: { "200": { $ref: '#/components/responses/Success' }, "400": { $ref: '#/components/responses/Error' }, "403": { $ref: '#/components/responses/Error' }, "404": { $ref: '#/components/responses/Error' } }
  /api/v1/auto-reply-rules:
    get:
      summary: List auto-reply rules
      parameters: [ { name: device_key, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' } ]
      responses: { "200": { $ref: '#/components/responses/Paginated' } }
    post: { summary: Create rule, requestBody: { $ref: '#/components/requestBodies/AutoReply' }, responses: { "201": { $ref: '#/components/responses/Success' } } }
  /api/v1/auto-reply-rules/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Get rule, responses: { "200": { $ref: '#/components/responses/Success' } } }
    patch: { summary: Update rule, requestBody: { $ref: '#/components/requestBodies/AutoReply' }, responses: { "200": { $ref: '#/components/responses/Success' } } }
    delete: { summary: Delete rule, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/auto-reply-rules/{id}/toggle:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post: { summary: Toggle rule, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/templates:
    get:
      summary: List templates
      parameters: [ { name: search, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' } ]
      responses: { "200": { $ref: '#/components/responses/Paginated' } }
    post: { summary: Create template, requestBody: { $ref: '#/components/requestBodies/Template' }, responses: { "201": { $ref: '#/components/responses/Success' } } }
  /api/v1/templates/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { summary: Get template, responses: { "200": { $ref: '#/components/responses/Success' } } }
    patch: { summary: Update template, requestBody: { $ref: '#/components/requestBodies/Template' }, responses: { "200": { $ref: '#/components/responses/Success' } } }
    delete: { summary: Delete template, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/templates/{id}/render:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post: { summary: Render template, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/analytics/overview:
    get: { summary: Analytics overview, responses: { "200": { $ref: '#/components/responses/Success' } } }
  /api/v1/analytics/daily:
    get:
      summary: Daily analytics
      parameters: [ { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } } ]
      responses: { "200": { $ref: '#/components/responses/Success' } }
  /api/v1/dashboard/stats:
    get: { summary: Homepage aggregate stats, responses: { "200": { $ref: '#/components/responses/Success' } } }
components:
  securitySchemes:
    tenantApiKey: { type: apiKey, in: header, name: apikey }
  parameters:
    DeviceKey: { name: key, in: path, required: true, schema: { type: string, maxLength: 32 } }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  responses:
    Success: { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
    Paginated: { description: Paginated success, content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  requestBodies:
    TenantUpdate: { required: true, content: { application/json: { schema: { type: object, properties: { webhook_url: { type: string, format: uri, nullable: true } } } } } }
    DeviceCreate: { required: true, content: { application/json: { schema: { type: object, properties: { phone_number: { type: string }, label: { type: string } } } } } }
    SendMessage: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SendMessage' } } } }
    Broadcast: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Broadcast' } } } }
    Contact: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactInput' } } } }
    AutoReply: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutoReplyInput' } } } }
    Template: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TemplateInput' } } } }
  schemas:
    Success:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { nullable: true } }
    Paginated:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { type: object } }
        pagination:
          type: object
          required: [total, limit, offset, has_more]
          properties: { total: { type: integer }, limit: { type: integer }, offset: { type: integer }, has_more: { type: boolean } }
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
    MessageStatus: { type: string, enum: [queued, sending, sent, delivered, read, failed, blocked, received] }
    SendMessage:
      type: object
      required: [device_key, to, message]
      properties: { device_key: { type: string }, to: { type: string, description: 'E.164 phone, or a WhatsApp group JID when replying to a recent inbound message in that same group' }, message: { type: string, maxLength: 4096 }, external_id: { type: string }, reply_to_message_id: { type: string, format: uuid, description: 'Required for group JIDs; must be a recent inbound message from that same chat' } }
    Broadcast:
      type: object
      required: [device_key, recipients, message]
      properties: { device_key: { type: string }, recipients: { type: array, minItems: 1, maxItems: 500, items: { type: string } }, message: { type: string } }
    ContactInput:
      type: object
      properties: { phone_number: { type: string }, name: { type: string, nullable: true }, tags: { type: array, items: { type: string } }, notes: { type: string, nullable: true } }
    AutoReplyInput:
      type: object
      properties: { device_key: { type: string }, trigger_type: { type: string, enum: [keyword, regex, all] }, trigger_pattern: { type: string }, response_type: { type: string, enum: [text, template] }, response_content: { type: string }, delay_ms: { type: integer }, is_active: { type: boolean } }
    TemplateInput:
      type: object
      properties: { name: { type: string }, content: { type: string }, is_active: { type: boolean } }
