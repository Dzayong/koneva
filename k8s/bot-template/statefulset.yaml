apiVersion: v1
kind: Service
metadata:
  name: bot-template
  namespace: wa-gateway
  labels:
    app.kubernetes.io/name: wa-bot
    app.kubernetes.io/component: bot
    app.kubernetes.io/part-of: wa-gateway
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: wa-bot
  ports:
    - { name: http, port: 9000, targetPort: http }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bot-template
  namespace: wa-gateway
  labels:
    app.kubernetes.io/name: wa-bot
    app.kubernetes.io/component: bot
    app.kubernetes.io/part-of: wa-gateway
    app.kubernetes.io/version: v1
    wa-gateway.io/template: "true"
spec:
  serviceName: bot-template
  replicas: 0
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: wa-bot
      wa-gateway.io/device-key: template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wa-bot
        app.kubernetes.io/component: bot
        app.kubernetes.io/part-of: wa-gateway
        app.kubernetes.io/version: v1
        wa-gateway.io/device-key: template
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9000"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bot
          image: wa-bot:latest
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 9000, protocol: TCP }
          envFrom:
            - configMapRef: { name: wa-gateway-config }
            - secretRef: { name: wa-gateway-secrets }
          env:
            - { name: BOT_ID, value: REPLACE_WITH_DEVICE_KEY }
            - { name: BOT_CONTAINER_PORT, value: "9000" }
            - { name: BOT_API_KEYS, valueFrom: { secretKeyRef: { name: wa-gateway-secrets, key: ADMIN_API_KEY } } }
            - { name: API_GATEWAY_URL, value: "http://api-gateway:8000" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - { name: session, mountPath: /app/sessions }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: session
        labels:
          app.kubernetes.io/name: wa-bot
          app.kubernetes.io/part-of: wa-gateway
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
