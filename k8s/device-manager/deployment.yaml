apiVersion: v1
kind: ServiceAccount
metadata:
  name: device-manager
  namespace: wa-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: device-manager
  namespace: wa-gateway
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/status", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: device-manager
  namespace: wa-gateway
subjects:
  - kind: ServiceAccount
    name: device-manager
    namespace: wa-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: device-manager
---
apiVersion: v1
kind: Service
metadata:
  name: device-manager
  namespace: wa-gateway
spec:
  selector:
    app: device-manager
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-manager
  namespace: wa-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-manager
  template:
    metadata:
      labels:
        app: device-manager
        app.kubernetes.io/name: device-manager
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: wa-gateway
    spec:
      serviceAccountName: device-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: device-manager
        image: wa-gateway-api:latest
        imagePullPolicy: Never
        command: ["node", "dist/src/device-manager/index.js"]
        ports:
        - name: http
          containerPort: 8001
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        envFrom:
        - configMapRef:
            name: wa-gateway-config
        - secretRef:
            name: wa-gateway-secrets
        env:
        - name: ORCHESTRATOR
          value: kubernetes
        - name: KUBERNETES_IN_CLUSTER
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
