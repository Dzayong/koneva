apiVersion: v1
kind: ServiceAccount
metadata:
  name: device-manager
  namespace: wa-gateway
  labels:
    app.kubernetes.io/name: device-manager
    app.kubernetes.io/part-of: wa-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: device-manager
  namespace: wa-gateway
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/status, persistentvolumeclaims, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: device-manager
  namespace: wa-gateway
subjects:
  - kind: ServiceAccount
    name: device-manager
    namespace: wa-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: device-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-manager
  namespace: wa-gateway
  labels:
    app.kubernetes.io/name: device-manager
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: wa-gateway
    app.kubernetes.io/version: v1
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: device-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: device-manager
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: wa-gateway
        app.kubernetes.io/version: v1
    spec:
      serviceAccountName: device-manager
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: device-manager
          image: your-registry/wa-gateway-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8001, protocol: TCP }
          envFrom:
            - configMapRef: { name: wa-gateway-config }
            - secretRef: { name: wa-gateway-secrets }
          env:
            - { name: ORCHESTRATOR, value: kubernetes }
            - { name: KUBERNETES_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: device-manager
  namespace: wa-gateway
  labels:
    app.kubernetes.io/name: device-manager
    app.kubernetes.io/part-of: wa-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: device-manager
  ports:
    - { name: http, port: 8001, targetPort: http, protocol: TCP }
