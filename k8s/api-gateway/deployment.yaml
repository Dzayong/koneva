apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: wa-gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: wa-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: wa-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: wa-gateway
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-gateway
        image: wa-gateway-api:latest
        imagePullPolicy: Never
        command: ["node", "dist/src/api-gateway/index.js"]
        ports:
        - name: http
          containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        envFrom:
        - configMapRef:
            name: wa-gateway-config
        - secretRef:
            name: wa-gateway-secrets
        env:
        - name: AI_REPLY_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: wa-gateway-ai-secrets
              key: AI_REPLY_ENCRYPTION_KEY
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
