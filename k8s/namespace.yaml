apiVersion: v1
kind: Namespace
metadata:
  name: wa-gateway
  labels:
    app: wa-gateway
    version: v1
    app.kubernetes.io/name: wa-gateway
    app.kubernetes.io/version: v1
    # Keep restricted enforcement enabled. Every workload in this namespace
    # declares a non-root UID, RuntimeDefault seccomp, and drops capabilities.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
